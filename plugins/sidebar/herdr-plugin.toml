id = "omp-herdr-agents.sidebar"
name = "omp Herdr Agents Sidebar"
version = "0.2.0"
# 0.9.0 is the first release with agent.view.set and agent.view.clear, the
# only Herdr methods the actions call. Tested on 0.9.1 and
# 0.9.2-preview.2026-09-29-8e78f929d8f0; other builds are untested. See README.md.
min_herdr_version = "0.9.0"
description = "Hide delegated subagents from the Agents view (Focus) or show every agent (All)"
platforms = ["linux", "macos"]

[[actions]]
id = "focus"
title = "Subagents: Focus (hide delegated children)"
contexts = ["global"]
command = ["node", "sidebar.mjs", "focus"]

[[actions]]
id = "all"
title = "Subagents: All (show every agent)"
contexts = ["global"]
command = ["node", "sidebar.mjs", "all"]

# Herdr has no install hook and runs startup hooks only at server start. The
# pane.agent_detected hook turns Focus on at the first agent Herdr detects
# after install, and re-applies it if the view was dropped. Both hooks do
# nothing when the user chose All.
[[startup]]
command = ["node", "sidebar.mjs", "restore"]

[[events]]
on = "pane.agent_detected"
command = ["node", "sidebar.mjs", "restore"]
